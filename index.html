<html>
  <head>
    <title>Solar System</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/examples/jsm/controls/OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.js"
        }
      }
    </script>
  </head>

  <body>
    <div id="lang-switch" class="lang-switch">
  <button type="button" data-lang="es" class="active">ES</button>
  <button type="button" data-lang="en">EN</button>
</div>

<aside id="planet-info" class="planet-card hidden">
  <header class="planet-card__header">
    <h2 id="planet-name">—</h2>
  </header>

  <p id="planet-data" class="planet-card__description"></p>

  <dl class="planet-card__stats">
    <div class="stat"><dt>Radius</dt><dd id="planet-radius">—</dd></div>
    <div class="stat"><dt>Distance from Sun</dt><dd id="planet-distance">—</dd></div>
    <div class="stat"><dt>Rotation</dt><dd id="planet-rotation">—</dd></div>
    <div class="stat"><dt>Orbit</dt><dd id="planet-translation">—</dd></div>
    <div class="stat stat--wide"><dt>Average Temperature</dt><dd id="planet-temperature">—</dd></div>
  </dl>
</aside>

    <script type="module" src="script_practica.js"></script>
  </body>
</html>
